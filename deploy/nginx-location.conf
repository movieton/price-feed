# Include inside the existing HTTPS server block after approval.
location = /feeds/price-feed.xml {
    alias /var/www/price-feed/feed.xml;
    default_type application/xml;
    charset utf-8;
    add_header Cache-Control "no-cache";

    # KIP / app.marketing-calendar.ru (verified DNS: 5.129.221.173).
    # Local access remains available for server-side health checks.
    allow 5.129.221.173;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    limit_except GET HEAD { deny all; }
}
